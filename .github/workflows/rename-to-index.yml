name: Rename site file to index.html
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename file to index.html
        run: |
          if [ -f nexais-sales-partners.html ]; then
            git config user.name "dastseri"
            git config user.email "dastseri@users.noreply.github.com"
            git mv nexais-sales-partners.html index.html
            git commit -m "Rename partner site file to index.html"
            git push
          else
            echo "index.html already in place; nothing to do."
          fi
